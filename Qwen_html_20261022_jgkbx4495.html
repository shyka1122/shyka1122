<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ZENITH Tournament</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body {
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: #fff; min-height: 100vh; padding: 20px;
}

header {
  text-align: center; margin-bottom: 25px;
  background: rgba(255,255,255,0.05);
  padding: 25px; border-radius: 20px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}

.logo-container {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; margin-bottom: 15px;
}

.logo-svg {
  width: 80px; height: 80px;
  filter: drop-shadow(0 0 15px rgba(255,0,0,0.5));
}

header h1 {
  font-size: 3.5em; font-weight: 900; letter-spacing: 8px;
  color: #ff0000;
  text-shadow: 0 0 20px rgba(255,0,0,0.5), 0 0 40px rgba(255,0,0,0.3);
}

header .subtitle { color: #888; font-size: 14px; letter-spacing: 3px; margin-top: 5px; }

/* Навигация между страницами */
.page-nav {
  display: flex; justify-content: center; gap: 10px;
  margin: 20px 0; flex-wrap: wrap;
}
.page-btn {
  padding: 10px 25px; border: 2px solid rgba(255,0,0,0.3);
  background: rgba(255,255,255,0.05); color: #fff;
  border-radius: 25px; cursor: pointer; font-weight: bold;
  transition: all 0.3s; font-size: 14px;
}
.page-btn:hover { background: rgba(255,0,0,0.2); border-color: #ff0000; }
.page-btn.active {
  background: linear-gradient(135deg, #ff0000, #ff4444);
  border-color: #ff0000;
  box-shadow: 0 0 20px rgba(255,0,0,0.4);
}

.controls {
  display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
  margin-top: 15px;
}
.btn {
  padding: 10px 20px; border: none; border-radius: 10px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff; font-weight: bold; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s; font-size: 13px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.4); }
.btn.danger { background: linear-gradient(135deg, #f093fb, #f5576c); }
.btn.success { background: linear-gradient(135deg, #4facfe, #00f2fe); }
.btn.warning { background: linear-gradient(135deg, #fa709a, #fee140); color: #000; }
.btn.info { background: linear-gradient(135deg, #a8edea, #fed6e3); color: #000; }
.btn.active { background: linear-gradient(135deg, #ff0000, #ff4444); }
.btn.hidden { display: none; }
.btn.small { padding: 8px 16px; font-size: 12px; }

/* Страницы */
.page { display: none; }
.page.active { display: block; }

/* Bracket */
.bracket-container {
  overflow-x: auto; padding: 20px;
  background: rgba(0,0,0,0.3); border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.1);
}
.bracket-wrapper { position: relative; display: inline-block; }
.bracket { display: flex; gap: 60px; padding: 20px; position: relative; z-index: 2; }
.round {
  display: flex; flex-direction: column;
  justify-content: space-around; min-width: 220px;
}
.round-title {
  text-align: center; font-size: 13px; font-weight: bold;
  color: #ff0000; margin-bottom: 5px; text-transform: uppercase;
  letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,0,0,0.3);
}
.round-datetime {
  text-align: center; font-size: 11px; color: #aaa;
  margin-bottom: 10px; cursor: pointer;
  padding: 3px 8px; border-radius: 5px;
  transition: all 0.2s;
}
.round-datetime:hover { background: rgba(255,0,0,0.15); color: #fff; }
.round-datetime.empty { color: #555; font-style: italic; }

.match {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 8px;
  transition: all 0.3s; position: relative; z-index: 3;
}
.match:hover { border-color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.3); }
.team-slot {
  padding: 8px 12px; margin: 4px 0; border-radius: 6px; cursor: pointer;
  background: rgba(255,255,255,0.03); transition: all 0.2s;
  display: flex; justify-content: space-between; align-items: center; font-size: 13px;
}
.team-slot:hover { background: rgba(255,0,0,0.15); }
.team-slot.winner {
  background: linear-gradient(90deg, rgba(0,255,100,0.3), rgba(0,255,100,0.1));
  border-left: 3px solid #00ff64; font-weight: bold;
}
.team-slot.loser { opacity: 0.5; text-decoration: line-through; }
.team-slot.empty { color: #666; font-style: italic; }
.team-slot .score { background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 4px; font-size: 12px; }

.lines-svg {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 1;
}
.lines-svg line { stroke: #ff0000; stroke-width: 2; fill: none; opacity: 0.6; }

/* Новости (Telegram стиль) */
.news-container {
  max-width: 700px; margin: 0 auto;
}
.news-post {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 15px; padding: 20px;
  margin-bottom: 20px;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
}
.news-post:hover { border-color: rgba(255,0,0,0.3); }
.news-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.news-avatar {
  width: 45px; height: 45px; border-radius: 50%;
  background: linear-gradient(135deg, #ff0000, #ff4444);
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 18px;
}
.news-author { font-weight: bold; color: #ff4444; font-size: 14px; }
.news-date { font-size: 11px; color: #888; }
.news-title {
  font-size: 18px; font-weight: bold; margin-bottom: 10px;
  color: #fff;
}
.news-content {
  font-size: 14px; line-height: 1.6; color: #ccc;
  white-space: pre-wrap; word-wrap: break-word;
}
.news-actions {
  display: flex; gap: 10px; margin-top: 15px;
  padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1);
}
.news-empty {
  text-align: center; padding: 60px 20px;
  color: #666; font-size: 16px;
}

/* Правила */
.rules-container {
  max-width: 800px; margin: 0 auto;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 15px; padding: 30px;
}
.rules-container h2 {
  color: #ff0000; margin-bottom: 20px;
  text-shadow: 0 0 10px rgba(255,0,0,0.3);
}
.rules-content {
  font-size: 15px; line-height: 1.8; color: #ccc;
  white-space: pre-wrap;
}
.rules-content ol, .rules-content ul { margin-left: 25px; margin-bottom: 15px; }
.rules-content li { margin-bottom: 8px; }

/* Модальные окна */
.modal {
  display: none; position: fixed; top: 0; left: 0;
  width: 100%; height: 100%; background: rgba(0,0,0,0.8);
  z-index: 1000; justify-content: center; align-items: center;
  backdrop-filter: blur(5px);
}
.modal.active { display: flex; }
.modal-content {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  padding: 30px; border-radius: 20px;
  width: 90%; max-width: 500px;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  max-height: 90vh; overflow-y: auto;
}
.modal-content h2 {
  margin-bottom: 20px; color: #ff0000;
  text-shadow: 0 0 10px rgba(255,0,0,0.3);
}
.modal-content input, .modal-content textarea {
  width: 100%; padding: 10px; margin: 8px 0;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; color: #fff; font-size: 14px;
}
.modal-content input:focus, .modal-content textarea:focus {
  outline: none; border-color: #ff0000;
}
.modal-buttons { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.modal-buttons .btn { flex: 1; min-width: 120px; }

.admin-badge {
  display: inline-block; padding: 5px 15px;
  background: linear-gradient(90deg, #ff0000, #ff4444);
  border-radius: 20px; font-size: 12px; margin-left: 10px;
}

.champion-banner {
  text-align: center; padding: 30px; margin: 20px 0;
  background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,140,0,0.2));
  border: 2px solid gold; border-radius: 20px;
  animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow {
  from { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
  to { box-shadow: 0 0 40px rgba(255,215,0,0.6); }
}
.champion-banner h2 {
  font-size: 2em;
  background: linear-gradient(90deg, gold, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.info-panel {
  background: rgba(255,255,255,0.05);
  padding: 15px; border-radius: 10px;
  margin-top: 15px; font-size: 13px;
  border-left: 3px solid #ff0000;
}

::-webkit-scrollbar { height: 10px; width: 10px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #ff0000, #ff4444); border-radius: 5px; }

#statusText { color: #aaa; margin-top: 10px; }

.social-links {
  display: flex; justify-content: center; gap: 15px;
  margin-top: 15px; flex-wrap: wrap;
}
.social-link {
  padding: 8px 20px; border-radius: 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,0,0,0.3);
  color: #fff; text-decoration: none;
  font-size: 13px; transition: all 0.3s;
  display: inline-flex; align-items: center; gap: 8px;
}
.social-link:hover {
  background: rgba(255,0,0,0.2);
  border-color: #ff0000;
  transform: translateY(-2px);
}
.social-link.disabled {
  opacity: 0.4; cursor: not-allowed;
  pointer-events: none;
}
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="90" fill="none" stroke="#ff0000" stroke-width="3"/>
      <circle cx="100" cy="100" r="85" fill="none" stroke="#000" stroke-width="2"/>
      <path d="M 30 100 Q 50 60 80 50 L 70 70 Q 50 80 40 100 Z" fill="#ff0000"/>
      <path d="M 170 100 Q 150 60 120 50 L 130 70 Q 150 80 160 100 Z" fill="#ff0000"/>
      <path d="M 30 100 Q 50 140 80 150 L 70 130 Q 50 120 40 100 Z" fill="#ff0000"/>
      <path d="M 170 100 Q 150 140 120 150 L 130 130 Q 150 120 160 100 Z" fill="#ff0000"/>
      <path d="M 95 30 L 100 10 L 105 30 Z" fill="#ff0000"/>
      <path d="M 85 40 L 90 20 L 95 35 Z" fill="#000"/>
      <path d="M 115 40 L 110 20 L 105 35 Z" fill="#000"/>
      <path d="M 95 170 L 100 190 L 105 170 Z" fill="#ff0000"/>
      <path d="M 85 160 L 90 180 L 95 165 Z" fill="#000"/>
      <path d="M 115 160 L 110 180 L 105 165 Z" fill="#000"/>
      <path d="M 70 60 L 130 60 L 120 110 L 105 110 L 105 130 L 95 130 L 95 110 L 80 110 Z" fill="#000" stroke="#ff0000" stroke-width="2"/>
      <path d="M 75 65 L 125 65 L 117 105 L 107 105 L 107 125 L 93 125 L 93 105 L 83 105 Z" fill="none" stroke="#ff0000" stroke-width="1"/>
      <path d="M 70 70 Q 50 70 50 90 Q 50 110 70 100" fill="none" stroke="#000" stroke-width="4"/>
      <path d="M 130 70 Q 150 70 150 90 Q 150 110 130 100" fill="none" stroke="#000" stroke-width="4"/>
      <rect x="80" y="135" width="40" height="8" fill="#000" stroke="#ff0000" stroke-width="1"/>
      <rect x="75" y="143" width="50" height="6" fill="#000" stroke="#ff0000" stroke-width="1"/>
      <rect x="70" y="149" width="60" height="8" fill="#000" stroke="#ff0000" stroke-width="1"/>
      <path d="M 90 75 L 110 75 L 110 80 L 102 80 L 102 100 L 98 100 L 98 80 L 90 80 Z" fill="#ff0000"/>
    </svg>
    <h1>ZENITH</h1>
  </div>
  <div class="subtitle">TOURNAMENT BRACKET SYSTEM</div>
  <p id="statusText">Турнирная сетка • Просмотр</p>

  <!-- Навигация между страницами -->
  <div class="page-nav">
    <button class="page-btn active" onclick="switchPage('bracket')"> Сетка турнира</button>
    <button class="page-btn" onclick="switchPage('news')"> Новости</button>
    <button class="page-btn" onclick="switchPage('rules')"> Правила</button>
  </div>

  <div class="controls">
    <button class="btn active" onclick="switchSize(32)">32 участника</button>
    <button class="btn" onclick="switchSize(64)">64 участника</button>
    <button class="btn success small" onclick="openAdminLogin()">🔐 Админ</button>
    <button class="btn danger small hidden" id="logoutBtn" onclick="logout()">Выйти</button>
    <button class="btn warning small hidden" id="resetBtn" onclick="resetBracket()">🔄 Сброс</button>
    <button class="btn info small hidden" id="settingsBtn" onclick="openSettings()">⚙️ Настройки</button>
  </div>

  <div class="social-links" id="socialLinks"></div>
</header>

<!-- СТРАНИЦА 1: Сетка -->
<div class="page active" id="page-bracket">
  <div id="championArea"></div>
  <div class="bracket-container">
    <div class="bracket-wrapper" id="bracketWrapper">
      <svg class="lines-svg" id="linesSvg"></svg>
      <div class="bracket" id="bracket"></div>
    </div>
  </div>
</div>

<!-- СТРАНИЦА 2: Новости -->
<div class="page" id="page-news">
  <div class="news-container" id="newsContainer"></div>
</div>

<!-- СТРАНИЦА 3: Правила -->
<div class="page" id="page-rules">
  <div class="rules-container">
    <h2>📋 Правила турнира ZENITH</h2>
    <div class="rules-content" id="rulesContent"></div>
  </div>
</div>

<!-- Модалка входа админа -->
<div class="modal" id="loginModal">
  <div class="modal-content">
    <h2>🔐 Вход администратора</h2>
    <input type="password" id="adminPass" placeholder="Пароль" onkeypress="if(event.key==='Enter')checkAdmin()">
    <div class="modal-buttons">
      <button class="btn" onclick="checkAdmin()">Войти</button>
      <button class="btn danger" onclick="closeModal('loginModal')">Отмена</button>
    </div>
  </div>
</div>

<!-- Модалка команды -->
<div class="modal" id="teamModal">
  <div class="modal-content">
    <h2 id="teamModalTitle">Редактировать команду</h2>
    <input type="text" id="teamName" placeholder="Название команды">
    <textarea id="teamRoster" placeholder="Состав команды (каждый игрок с новой строки)" rows="5"></textarea>
    <input type="number" id="teamScore" placeholder="Счёт (если назначен)" min="0">
    <div class="modal-buttons">
      <button class="btn success" onclick="saveTeam()">💾 Сохранить</button>
      <button class="btn warning" onclick="techLoss()">⚠️ Тех. поражение</button>
      <button class="btn danger" onclick="deleteTeam()">🗑️ Удалить</button>
      <button class="btn" onclick="closeModal('teamModal')">Отмена</button>
    </div>
    <div class="info-panel">
      💡 Чтобы назначить победителя — введите счёт для обеих команд и сохраните.
    </div>
  </div>
</div>

<!-- Модалка настроек -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <h2>⚙️ Настройки турнира</h2>
    <label style="color:#aaa;font-size:12px;">Ссылка на группу MAX</label>
    <input type="text" id="maxLink" placeholder="https://max.ru/...">
    <label style="color:#aaa;font-size:12px;">Ссылка на Telegram поддержки</label>
    <input type="text" id="tgLink" placeholder="https://t.me/...">
    <label style="color:#aaa;font-size:12px;">Текст правил турнира</label>
    <textarea id="rulesText" placeholder="Введите правила турнира..." rows="8"></textarea>
    <div class="modal-buttons">
      <button class="btn success" onclick="saveSettings()">💾 Сохранить</button>
      <button class="btn" onclick="closeModal('settingsModal')">Отмена</button>
    </div>
  </div>
</div>

<!-- Модалка даты раунда -->
<div class="modal" id="datetimeModal">
  <div class="modal-content">
    <h2>📅 Дата и время раунда</h2>
    <p id="datetimeRoundName" style="color:#aaa;margin-bottom:15px;"></p>
    <input type="datetime-local" id="roundDatetime">
    <div class="modal-buttons">
      <button class="btn success" onclick="saveDatetime()"> Сохранить</button>
      <button class="btn danger" onclick="clearDatetime()">🗑️ Очистить</button>
      <button class="btn" onclick="closeModal('datetimeModal')">Отмена</button>
    </div>
  </div>
</div>

<!-- Модалка новости -->
<div class="modal" id="newsModal">
  <div class="modal-content">
    <h2 id="newsModalTitle">Новая новость</h2>
    <input type="text" id="newsTitle" placeholder="Заголовок новости">
    <textarea id="newsContent" placeholder="Текст новости..." rows="6"></textarea>
    <div class="modal-buttons">
      <button class="btn success" onclick="saveNews()">💾 Опубликовать</button>
      <button class="btn" onclick="closeModal('newsModal')">Отмена</button>
    </div>
  </div>
</div>

<script>
let state = {
  size: 32,
  isAdmin: false,
  adminPass: 'admin123',
  data: { 32: null, 64: null },
  currentEdit: null,
  settings: { maxLink: '', tgLink: '', rulesText: '' },
  roundDatetimes: {},
  news: [],
  currentNewsEdit: null
};

function loadState() {
  const saved = localStorage.getItem('tournamentData');
  if (saved) {
    const parsed = JSON.parse(saved);
    state.data = parsed.data || { 32: null, 64: null };
    state.size = parsed.size || 32;
    state.settings = parsed.settings || { maxLink: '', tgLink: '', rulesText: '' };
    state.roundDatetimes = parsed.roundDatetimes || {};
    state.news = parsed.news || [];
  }
  if (!state.settings.rulesText) {
    state.settings.rulesText = `1. Турнир проводится по олимпийской системе (на вылет).
2. Количество участников: 32 или 64 команды.
3. Матчи проходят в формате BO1 (до одной победы), финал — BO3.
4. Техническое поражение присуждается при неявке команды в течение 15 минут.
5. За нарушение спортивного поведения — дисквалификация.
6. Решения администрации являются окончательными.
7. Все результаты заносятся администратором турнира.`;
  }
}

function saveState() {
  localStorage.setItem('tournamentData', JSON.stringify({
    data: state.data,
    size: state.size,
    settings: state.settings,
    roundDatetimes: state.roundDatetimes,
    news: state.news
  }));
}

// Навигация между страницами
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  event.target.classList.add('active');
  
  if (page === 'news') renderNews();
  if (page === 'rules') renderRules();
  if (page === 'bracket') setTimeout(drawLines, 100);
}

function generateBracket(size) {
  if (state.data[size]) return state.data[size];
  const rounds = Math.log2(size);
  const bracket = [];
  const firstRound = [];
  for (let i = 0; i < size / 2; i++) {
    firstRound.push({ id: `r0_m${i}`, team1: null, team2: null, score1: null, score2: null, winner: null, techLoss: null });
  }
  bracket.push(firstRound);
  for (let r = 1; r < rounds; r++) {
    const round = [];
    const matchCount = size / Math.pow(2, r + 1);
    for (let i = 0; i < matchCount; i++) {
      round.push({ id: `r${r}_m${i}`, team1: null, team2: null, score1: null, score2: null, winner: null, techLoss: null });
    }
    bracket.push(round);
  }
  state.data[size] = bracket;
  return bracket;
}

function getRoundName(roundIndex, totalRounds) {
  const fromEnd = totalRounds - roundIndex - 1;
  if (fromEnd === 0) return '🏆 ФИНАЛ';
  if (fromEnd === 1) return 'Полуфинал';
  if (fromEnd === 2) return 'Четвертьфинал';
  return `Раунд ${roundIndex + 1}`;
}

function render() {
  const bracket = generateBracket(state.size);
  const container = document.getElementById('bracket');
  container.innerHTML = '';
  const totalRounds = bracket.length;
  
  bracket.forEach((round, rIdx) => {
    const roundDiv = document.createElement('div');
    roundDiv.className = 'round';
    roundDiv.dataset.round = rIdx;
    
    const title = document.createElement('div');
    title.className = 'round-title';
    title.textContent = getRoundName(rIdx, totalRounds);
    roundDiv.appendChild(title);
    
    // Дата и время раунда
    const dtKey = `${state.size}_r${rIdx}`;
    const dt = state.roundDatetimes[dtKey];
    const dtDiv = document.createElement('div');
    dtDiv.className = 'round-datetime' + (dt ? '' : ' empty');
    dtDiv.textContent = dt ? `📅 ${formatDatetime(dt)}` : '📅 Дата не указана';
    if (state.isAdmin) {
      dtDiv.onclick = () => openDatetimeModal(rIdx);
      dtDiv.title = 'Кликните чтобы изменить (только админ)';
    }
    roundDiv.appendChild(dtDiv);
    
    round.forEach((match, mIdx) => {
      const matchDiv = document.createElement('div');
      matchDiv.className = 'match';
      matchDiv.dataset.round = rIdx;
      matchDiv.dataset.match = mIdx;
      matchDiv.appendChild(createTeamSlot(match, 1, rIdx, mIdx));
      matchDiv.appendChild(createTeamSlot(match, 2, rIdx, mIdx));
      if (match.techLoss) {
        const techLabel = document.createElement('div');
        techLabel.style.cssText = 'font-size:10px;color:#ff4444;text-align:center;margin-top:4px;';
        techLabel.textContent = `⚠️ Тех. поражение: ${match.techLoss}`;
        matchDiv.appendChild(techLabel);
      }
      roundDiv.appendChild(matchDiv);
    });
    container.appendChild(roundDiv);
  });
  
  const finalMatch = bracket[bracket.length - 1][0];
  const champArea = document.getElementById('championArea');
  if (finalMatch.winner) {
    champArea.innerHTML = `<div class="champion-banner"><h2>👑 ЧЕМПИОН: ${finalMatch.winner.name}</h2><p>Состав: ${finalMatch.winner.roster || 'не указан'}</p></div>`;
  } else { champArea.innerHTML = ''; }
  
  document.querySelectorAll('.controls .btn').forEach((b, i) => {
    if (i === 0) b.classList.toggle('active', state.size === 32);
    if (i === 1) b.classList.toggle('active', state.size === 64);
  });
  
  document.getElementById('logoutBtn').classList.toggle('hidden', !state.isAdmin);
  document.getElementById('resetBtn').classList.toggle('hidden', !state.isAdmin);
  document.getElementById('settingsBtn').classList.toggle('hidden', !state.isAdmin);
  
  renderSocialLinks();
  setTimeout(drawLines, 50);
}

function formatDatetime(dt) {
  const d = new Date(dt);
  return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function renderSocialLinks() {
  const container = document.getElementById('socialLinks');
  let html = '';
  
  if (state.settings.maxLink) {
    html += `<a href="${state.settings.maxLink}" target="_blank" class="social-link">🌐 Группа MAX</a>`;
  } else {
    html += `<span class="social-link disabled">🌐 Группа MAX</span>`;
  }
  
  if (state.settings.tgLink) {
    html += `<a href="${state.settings.tgLink}" target="_blank" class="social-link">✈️ TG Поддержки</a>`;
  } else {
    html += `<span class="social-link disabled">✈️ TG Поддержки</span>`;
  }
  
  container.innerHTML = html;
}

function drawLines() {
  const svg = document.getElementById('linesSvg');
  const wrapper = document.getElementById('bracketWrapper');
  const bracket = document.getElementById('bracket');
  const wrapperRect = wrapper.getBoundingClientRect();
  svg.setAttribute('width', wrapper.scrollWidth);
  svg.setAttribute('height', wrapper.scrollHeight);
  svg.innerHTML = '';
  
  const rounds = bracket.querySelectorAll('.round');
  for (let r = 1; r < rounds.length; r++) {
    const currentRound = rounds[r];
    const prevRound = rounds[r - 1];
    const matches = currentRound.querySelectorAll('.match');
    const prevMatches = prevRound.querySelectorAll('.match');
    matches.forEach((match, mIdx) => {
      const matchRect = match.getBoundingClientRect();
      const leftX = matchRect.left - wrapperRect.left;
      const centerY = matchRect.top + matchRect.height / 2 - wrapperRect.top;
      const parent1 = prevMatches[mIdx * 2];
      const parent2 = prevMatches[mIdx * 2 + 1];
      if (parent1 && parent2) {
        const p1Rect = parent1.getBoundingClientRect();
        const p2Rect = parent2.getBoundingClientRect();
        const p1Right = p1Rect.right - wrapperRect.left;
        const p1CenterY = p1Rect.top + p1Rect.height / 2 - wrapperRect.top;
        const p2Right = p2Rect.right - wrapperRect.left;
        const p2CenterY = p2Rect.top + p2Rect.height / 2 - wrapperRect.top;
        const midX = (p1Right + leftX) / 2;
        const makeLine = (x1,y1,x2,y2) => {
          const l = document.createElementNS('http://www.w3.org/2000/svg','line');
          l.setAttribute('x1',x1); l.setAttribute('y1',y1);
          l.setAttribute('x2',x2); l.setAttribute('y2',y2);
          svg.appendChild(l);
        };
        makeLine(p1Right, p1CenterY, midX, p1CenterY);
        makeLine(midX, p1CenterY, midX, centerY);
        makeLine(p2Right, p2CenterY, midX, p2CenterY);
        makeLine(midX, p2CenterY, midX, centerY);
        makeLine(midX, centerY, leftX, centerY);
      }
    });
  }
}

function createTeamSlot(match, teamNum, rIdx, mIdx) {
  const slot = document.createElement('div');
  slot.className = 'team-slot';
  const team = teamNum === 1 ? match.team1 : match.team2;
  const score = teamNum === 1 ? match.score1 : match.score2;
  if (team) {
    slot.innerHTML = `<span>${team.name}</span><span class="score">${score !== null ? score : '-'}</span>`;
    if (match.winner === team) slot.classList.add('winner');
    else if (match.winner && match.winner !== team) slot.classList.add('loser');
  } else {
    slot.classList.add('empty');
    slot.textContent = teamNum === 1 ? '← Команда 1' : '← Команда 2';
  }
  slot.onclick = () => {
    if (!state.isAdmin) {
      if (team) showTeamInfo(team);
      else alert('Войдите как администратор, чтобы редактировать сетку');
      return;
    }
    openTeamModal(rIdx, mIdx, teamNum);
  };
  return slot;
}

function showTeamInfo(team) { alert(`🏅 ${team.name}\n\n Состав:\n${team.roster || 'Не указан'}`); }

function openTeamModal(rIdx, mIdx, teamNum) {
  const match = state.data[state.size][rIdx][mIdx];
  const team = teamNum === 1 ? match.team1 : match.team2;
  state.currentEdit = { rIdx, mIdx, teamNum };
  document.getElementById('teamModalTitle').textContent = team ? `Редактировать: ${team.name}` : 'Добавить команду';
  document.getElementById('teamName').value = team ? team.name : '';
  document.getElementById('teamRoster').value = team ? team.roster : '';
  document.getElementById('teamScore').value = teamNum === 1 ? (match.score1 ?? '') : (match.score2 ?? '');
  document.getElementById('teamModal').classList.add('active');
}

function saveTeam() {
  const { rIdx, mIdx, teamNum } = state.currentEdit;
  const match = state.data[state.size][rIdx][mIdx];
  const name = document.getElementById('teamName').value.trim();
  const roster = document.getElementById('teamRoster').value.trim();
  const score = document.getElementById('teamScore').value;
  if (!name) { alert('Введите название команды'); return; }
  const team = { name, roster };
  if (teamNum === 1) { match.team1 = team; if (score !== '') match.score1 = parseInt(score); }
  else { match.team2 = team; if (score !== '') match.score2 = parseInt(score); }
  match.techLoss = null;
  if (match.team1 && match.team2 && match.score1 !== null && match.score2 !== null) {
    if (match.score1 > match.score2) match.winner = match.team1;
    else if (match.score2 > match.score1) match.winner = match.team2;
    else match.winner = null;
    advanceWinner(rIdx, mIdx, match.winner);
  }
  saveState(); closeModal('teamModal'); render();
}

function techLoss() {
  const { rIdx, mIdx, teamNum } = state.currentEdit;
  const match = state.data[state.size][rIdx][mIdx];
  const winnerTeam = teamNum === 1 ? match.team2 : match.team1;
  const loserTeam = teamNum === 1 ? match.team1 : match.team2;
  if (!winnerTeam) { alert('Сначала добавьте противоположную команду!'); return; }
  if (!confirm(`Назначить техническое поражение "${loserTeam ? loserTeam.name : '?'}"? Победит "${winnerTeam.name}".`)) return;
  match.score1 = teamNum === 1 ? 0 : 1;
  match.score2 = teamNum === 1 ? 1 : 0;
  match.winner = winnerTeam;
  match.techLoss = loserTeam ? loserTeam.name : 'Неизвестно';
  advanceWinner(rIdx, mIdx, winnerTeam);
  saveState(); closeModal('teamModal'); render();
}

function advanceWinner(rIdx, mIdx, winner) {
  const bracket = state.data[state.size];
  if (rIdx + 1 >= bracket.length) return;
  const nextMatchIdx = Math.floor(mIdx / 2);
  const nextMatch = bracket[rIdx + 1][nextMatchIdx];
  if (mIdx % 2 === 0) nextMatch.team1 = winner;
  else nextMatch.team2 = winner;
}

function deleteTeam() {
  if (!confirm('Удалить команду?')) return;
  const { rIdx, mIdx, teamNum } = state.currentEdit;
  const match = state.data[state.size][rIdx][mIdx];
  if (teamNum === 1) { match.team1 = null; match.score1 = null; }
  else { match.team2 = null; match.score2 = null; }
  match.winner = null; match.techLoss = null;
  saveState(); closeModal('teamModal'); render();
}

function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function openAdminLogin() {
  if (state.isAdmin) { alert('Вы уже вошли как администратор'); return; }
  document.getElementById('adminPass').value = '';
  document.getElementById('loginModal').classList.add('active');
}

function checkAdmin() {
  const pass = document.getElementById('adminPass').value;
  if (pass === state.adminPass) {
    state.isAdmin = true;
    closeModal('loginModal');
    document.getElementById('statusText').innerHTML = 'Режим администратора <span class="admin-badge">ADMIN</span>';
    render();
  } else { alert('❌ Неверный пароль'); }
}

function logout() {
  state.isAdmin = false;
  document.getElementById('statusText').textContent = 'Турнирная сетка • Просмотр';
  render();
}

function switchSize(size) { state.size = size; saveState(); render(); }

function resetBracket() {
  if (!state.isAdmin) { alert('Только для администратора!'); return; }
  if (!confirm('Сбросить всю сетку?')) return;
  state.data[state.size] = null;
  saveState(); render();
}

// Настройки
function openSettings() {
  if (!state.isAdmin) { alert('Только для администратора!'); return; }
  document.getElementById('maxLink').value = state.settings.maxLink || '';
  document.getElementById('tgLink').value = state.settings.tgLink || '';
  document.getElementById('rulesText').value = state.settings.rulesText || '';
  document.getElementById('settingsModal').classList.add('active');
}

function saveSettings() {
  state.settings.maxLink = document.getElementById('maxLink').value.trim();
  state.settings.tgLink = document.getElementById('tgLink').value.trim();
  state.settings.rulesText = document.getElementById('rulesText').value;
  saveState();
  closeModal('settingsModal');
  render();
  renderRules();
  alert('✅ Настройки сохранены!');
}

// Дата/время раунда
function openDatetimeModal(rIdx) {
  if (!state.isAdmin) { alert('Только администратор может изменять дату!'); return; }
  const totalRounds = state.data[state.size].length;
  const dtKey = `${state.size}_r${rIdx}`;
  document.getElementById('datetimeRoundName').textContent = getRoundName(rIdx, totalRounds);
  document.getElementById('roundDatetime').value = state.roundDatetimes[dtKey] || '';
  document.getElementById('datetimeModal').classList.add('active');
  state.currentDatetimeRound = rIdx;
}

function saveDatetime() {
  const rIdx = state.currentDatetimeRound;
  const dt = document.getElementById('roundDatetime').value;
  const dtKey = `${state.size}_r${rIdx}`;
  if (dt) state.roundDatetimes[dtKey] = dt;
  else delete state.roundDatetimes[dtKey];
  saveState(); closeModal('datetimeModal'); render();
}

function clearDatetime() {
  const rIdx = state.currentDatetimeRound;
  const dtKey = `${state.size}_r${rIdx}`;
  delete state.roundDatetimes[dtKey];
  saveState(); closeModal('datetimeModal'); render();
}

// Новости
function renderNews() {
  const container = document.getElementById('newsContainer');
  if (state.news.length === 0) {
    container.innerHTML = '<div class="news-empty">📭 Новостей пока нет.<br>Администратор может добавить первую новость!</div>';
    if (state.isAdmin) {
      container.innerHTML += '<div style="text-align:center;margin-top:20px;"><button class="btn success" onclick="openNewsModal()">➕ Добавить новость</button></div>';
    }
    return;
  }
  
  let html = '';
  if (state.isAdmin) {
    html += '<div style="text-align:center;margin-bottom:20px;"><button class="btn success" onclick="openNewsModal()">➕ Добавить новость</button></div>';
  }
  
  state.news.slice().reverse().forEach((news, idx) => {
    const realIdx = state.news.length - 1 - idx;
    html += `
      <div class="news-post">
        <div class="news-header">
          <div class="news-avatar">Z</div>
          <div>
            <div class="news-author">ZENITH Admin</div>
            <div class="news-date">${news.date}</div>
          </div>
        </div>
        <div class="news-title">${escapeHtml(news.title)}</div>
        <div class="news-content">${escapeHtml(news.content)}</div>
        ${state.isAdmin ? `
          <div class="news-actions">
            <button class="btn small" onclick="editNews(${realIdx})">✏️ Редактировать</button>
            <button class="btn danger small" onclick="deleteNews(${realIdx})">🗑️ Удалить</button>
          </div>
        ` : ''}
      </div>
    `;
  });
  
  container.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function openNewsModal() {
  if (!state.isAdmin) { alert('Только администратор!'); return; }
  state.currentNewsEdit = null;
  document.getElementById('newsModalTitle').textContent = 'Новая новость';
  document.getElementById('newsTitle').value = '';
  document.getElementById('newsContent').value = '';
  document.getElementById('newsModal').classList.add('active');
}

function editNews(idx) {
  if (!state.isAdmin) return;
  const news = state.news[idx];
  state.currentNewsEdit = idx;
  document.getElementById('newsModalTitle').textContent = 'Редактировать новость';
  document.getElementById('newsTitle').value = news.title;
  document.getElementById('newsContent').value = news.content;
  document.getElementById('newsModal').classList.add('active');
}

function saveNews() {
  const title = document.getElementById('newsTitle').value.trim();
  const content = document.getElementById('newsContent').value.trim();
  if (!title || !content) { alert('Заполните заголовок и текст!'); return; }
  
  const now = new Date();
  const dateStr = now.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  
  if (state.currentNewsEdit !== null) {
    state.news[state.currentNewsEdit].title = title;
    state.news[state.currentNewsEdit].content = content;
    state.news[state.currentNewsEdit].edited = dateStr;
  } else {
    state.news.push({ title, content, date: dateStr });
  }
  
  saveState(); closeModal('newsModal'); renderNews();
}

function deleteNews(idx) {
  if (!state.isAdmin) return;
  if (!confirm('Удалить новость?')) return;
  state.news.splice(idx, 1);
  saveState(); renderNews();
}

// Правила
function renderRules() {
  document.getElementById('rulesContent').textContent = state.settings.rulesText || 'Правила не установлены.';
}

// Инициализация
loadState();
render();
renderRules();
if (state.isAdmin) {
  document.getElementById('statusText').innerHTML = 'Режим администратора <span class="admin-badge">ADMIN</span>';
}

window.addEventListener('scroll', () => setTimeout(drawLines, 100));
window.addEventListener('resize', () => setTimeout(drawLines, 100));
</script>
